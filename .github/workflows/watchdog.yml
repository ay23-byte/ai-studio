name: watchdog

# Dead-man switch: alerts when the channel has not published in ~26 hours,
# which catches silently disabled schedules, expired tokens and quota blocks.

on:
  schedule:
    - cron: "0 7 * * *"   # 12:30 PM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Restore studio database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: db/studio.sqlite
          key: studio-db-${{ github.run_id }}
          restore-keys: |
            studio-db-

      - name: Fail when nothing was published recently
        run: python run_daily.py --check-freshness 26

      - name: Alert on failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="⚠️ AI Studio watchdog: no video published in the last 26 hours." > /dev/null
          fi
