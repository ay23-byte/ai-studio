name: make-shorts

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (blank = next from topics.json)"
        required: false
        default: ""
      category:
        description: "Category"
        type: choice
        options: [finance, markets, money, power, human]
        default: finance
      language:
        description: "Voice language"
        type: choice
        options: [hindi, english]
        default: hindi
      engine:
        description: "Voice engine (chatterbox-http = remote GPU server)"
        type: choice
        options: [auto, chatterbox-http, chatterbox, edge, silent]
        default: auto
      script_source:
        description: "Script source (demo = built-in script, no API key needed)"
        type: choice
        options: [gemini, demo]
        default: gemini
      profile:
        description: "Pacing profile"
        type: choice
        options: [fast, energetic, natural, documentary]
        default: fast
      upload:
        description: "Upload to YouTube after building?"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST daily

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Voice
      VOICE_ENGINE: ${{ inputs.engine || 'auto' }}
      VOICE_PROFILE: ${{ inputs.profile || 'fast' }}
      CHATTERBOX_API_URL: ${{ secrets.CHATTERBOX_API_URL }}
      CHATTERBOX_API_TOKEN: ${{ secrets.CHATTERBOX_API_TOKEN }}
      CHATTERBOX_REF: ${{ vars.CHATTERBOX_REF }}
      CHANNEL_NAME: "Power Codex"
      PRIVACY: "private"
      # PUBLISH_AT_IST: "19:00"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Install local Chatterbox
        if: ${{ inputs.engine == 'chatterbox' }}
        run: pip install -r requirements-voice.txt -c constraints.txt

      - name: Restore studio database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: db/studio.sqlite
          key: studio-db-${{ github.run_id }}
          restore-keys: |
            studio-db-

      - name: Build Shorts video
        run: |
          if [ "${{ inputs.script_source }}" = "demo" ]; then
            python run.py shorts "Built-in demo script" --demo \
              --language "${{ inputs.language }}" \
              --engine "$VOICE_ENGINE" \
              --profile "$VOICE_PROFILE"
          elif [ -n "${{ inputs.topic }}" ]; then
            python run.py shorts "${{ inputs.topic }}" \
              --category "${{ inputs.category }}" \
              --language "${{ inputs.language }}" \
              --engine "$VOICE_ENGINE" \
              --profile "$VOICE_PROFILE"
          else
            python run_daily.py --format shorts \
              --engine "$VOICE_ENGINE" \
              --profile "$VOICE_PROFILE"
          fi

      - name: Upload to YouTube (QA-gated)
        if: ${{ inputs.upload == true || github.event_name == 'schedule' }}
        run: python run_daily.py --upload-latest

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: always()
        with:
          name: shorts-output
          path: |
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 14

      - name: Save studio database
        if: ${{ always() && hashFiles('db/studio.sqlite') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: db/studio.sqlite
          key: studio-db-${{ github.run_id }}

      - name: Persist topic progress
        if: always()
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics.json
          git diff --cached --quiet || (git commit -m "bot: advance topics.json" && git pull --rebase && git push)

      - name: Alert on failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="❌ AI Studio make-shorts failed. Check GitHub Actions." > /dev/null
          fi
