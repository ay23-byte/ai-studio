name: make-shorts

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (blank = next from topics.json)"
        required: false
        default: ""
      category:
        description: "Category"
        type: choice
        options: [finance, markets, money, power, human]
        default: finance
      language:
        description: "Voice language"
        type: choice
        options: [hindi, english]
        default: hindi
      engine:
        description: "Voice engine (chatterbox-http = remote GPU server)"
        type: choice
        options: [auto, chatterbox-http, chatterbox, edge, silent]
        default: auto
      profile:
        description: "Pacing profile"
        type: choice
        options: [fast, energetic, natural, documentary]
        default: fast
      upload:
        description: "Upload to YouTube after building?"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST daily

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Voice
      VOICE_ENGINE: ${{ inputs.engine || 'auto' }}
      VOICE_PROFILE: ${{ inputs.profile || 'fast' }}
      CHATTERBOX_API_URL: ${{ secrets.CHATTERBOX_API_URL }}
      CHATTERBOX_API_TOKEN: ${{ secrets.CHATTERBOX_API_TOKEN }}
      CHATTERBOX_REF: ${{ vars.CHATTERBOX_REF }}
      CHANNEL_NAME: "Power Codex"
      PRIVACY: "private"
      # PUBLISH_AT_IST: "19:00"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-devanagari

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Only needed when a GPU runner is used; the hosted CPU runners are slow.
      - name: Install local Chatterbox
        if: ${{ inputs.engine == 'chatterbox' }}
        run: pip install -r requirements-voice.txt

      - name: Build Shorts video
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            python run.py shorts "${{ inputs.topic }}" \
              --category "${{ inputs.category }}" \
              --language "${{ inputs.language }}" \
              --engine "$VOICE_ENGINE" \
              --profile "$VOICE_PROFILE"
          else
            python run_daily.py --format shorts \
              --engine "$VOICE_ENGINE" \
              --profile "$VOICE_PROFILE"
          fi

      - name: Upload to YouTube
        if: ${{ inputs.upload == true || github.event_name == 'schedule' }}
        run: python run_daily.py --upload-latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-output
          path: |
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-db
          path: db/studio.sqlite
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist topic progress
        if: always()
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics.json
          git diff --cached --quiet || (git commit -m "bot: advance topics.json" && git pull --rebase && git push)

      - name: Alert on failure
        if: failure()
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="❌ AI Studio make-shorts failed. Check GitHub Actions." > /dev/null
          fi
