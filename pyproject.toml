[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio"
version = "2.0.0"
description = "Automated Hindi/Hinglish faceless video studio with Chatterbox voice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
# Chatterbox needs torch and ~4 GB of disk for weights; keep it optional.
voice = ["chatterbox-tts>=0.1.2"]
publish = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5", "ruff>=0.6"]

[project.scripts]
ai-studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end render tests (set STUDIO_SLOW_TESTS=1 to run)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # long strings in prompts/filters are intentional
    "UP017", # datetime.UTC is 3.11+, project supports 3.10
    "UP035", # typing imports are fine on 3.10
    "UP037",
    "B905",  # zip(strict=) is 3.10+
    "B027",  # lifecycle hooks are intentionally optional no-ops
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
